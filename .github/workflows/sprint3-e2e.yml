name: ICEIBank Sprint 3 E2E
on:
  push:
    branches: [sprint3-e2e]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and start RabbitMQ and the agencies
        run: |
          mkdir -p evidencias/sprint3
          python3 -m pip install pillow --break-system-packages
          docker run -d --name iceibank-rabbit -p 5672:5672 rabbitmq:3.13
          mvn -B -f agencia/pom.xml -DskipTests package
          for n in {1..60}; do docker exec iceibank-rabbit rabbitmq-diagnostics -q ping && break; sleep 1; done
          cat > /tmp/start-iceibank <<'SH'
          cd agencia
          AGENCIA_ID="$1" nohup java -jar target/agencia-0.0.1-SNAPSHOT.jar > "/tmp/iceibank-$1.log" 2>&1 &
          echo $! > "/tmp/iceibank-$1.pid"
          SH
          for id in 0 1 2; do bash /tmp/start-iceibank "$id"; done
      - name: Exercise real HTTP, RabbitMQ, Bully and synchronization
        run: |
          cat > /tmp/icei_evidence.py <<'PY'
          import io,json,re,subprocess,time,urllib.request,urllib.error
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          out=Path('evidencias/sprint3')
          def sh(*args): return subprocess.check_output(args).decode().strip()
          def now(): return sh('pwsh','-NoProfile','-Command','Get-Date -Format "yyyy-MM-dd HH:mm:ss zzz"')
          def api(p,path,body=None,token=None):
              headers={'Content-Type':'application/json'}
              if token: headers['Authorization']='Bearer '+token
              request=urllib.request.Request(f'http://127.0.0.1:{p}{path}',None if body is None else json.dumps(body).encode(),headers)
              try:
                  with urllib.request.urlopen(request,timeout=4) as r: return r.status,json.load(r)
              except urllib.error.HTTPError as r: return r.code,json.load(r)
          def wait(f,seconds=65):
              deadline=time.monotonic()+seconds
              while time.monotonic()<deadline:
                  try:
                      v=f()
                      if v: return v
                  except (OSError,ValueError,KeyError,SyntaxError,subprocess.CalledProcessError): pass
                  time.sleep(.75)
              raise AssertionError('Tempo esgotado aguardando condição: '+str(f))
          def leaders(ids,leader):
              states=[api(4000+i,'/bully/lider')[1] for i in ids]
              return states if all(s['liderAtual']==leader for s in states) else None
          def stop(id):
              sh('kill',Path(f'/tmp/iceibank-{id}.pid').read_text().strip())
              return f'$ kill $(cat /tmp/iceibank-{id}.pid)'
          def capture(name,title,lines,android=None):
              stamp='$ Get-Date    '+now()
              font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf',17)
              full=[title,stamp,'']+list(lines)
              width=max(880,max(map(len,full))*11+44)
              panel=Image.new('RGB',(width,28+len(full)*25),'#101a20')
              draw=ImageDraw.Draw(panel)
              for i,line in enumerate(full): draw.text((18,16+i*25),line,font=font,fill='#b6f5d8' if i<2 else '#f5f7f8')
              if android:
                  screen=Image.open(io.BytesIO(android)).convert('RGB')
                  canvas=Image.new('RGB',(max(width,screen.width),panel.height+screen.height),'#101a20')
                  canvas.paste(panel,(0,0)); canvas.paste(screen,((canvas.width-screen.width)//2,panel.height)); panel=canvas
              panel.save(out/(name+'.png'))
          def state_lines(states):
              return [line for s in states for line in (f'$ GET :{4000+s["idAgencia"]}/bully/lider',json.dumps(s))]
          if __name__=='__main__':
              states=wait(lambda:leaders([0,1,2],2))
              capture('eleicao-inicial','Eleição de três processos Java',state_lines(states))
              cmd=stop(2)
              states=wait(lambda:leaders([0,1],1))
              capture('failover','Após encerrar a líder, heartbeat elegeu a agência 1',[cmd]+state_lines(states))
              history=sh('node','agencia/historico-lideranca.js')
              capture('historico-lideranca','Saída real do histórico de liderança',['$ node agencia/historico-lideranca.js']+history.splitlines()[-15:])
              token=api(4000,'/auth/login',{'login':'ana','senha':'senha123'})[1]['token']
              for p,id in ((4000,0),(4000,3),(4001,1)):
                  code,_=api(p,'/contas',{'id':id,'nomeAluno':'Ana','saldoInicial':100},token); assert code==201
              code,_=api(4000,'/transferencias',{'idOrigem':0,'idDestino':3,'valor':2},token); assert code==200
              code,data=api(4000,'/transferencias',{'idOrigem':0,'idDestino':1,'valor':3},token); assert code==200 and data['status']=='PUBLICADA'
              wait(lambda:api(4001,'/contas/1',token=token)[1]['saldo']==103)
              vetor=api(4000,'/contas/0',token=token)[1]['vetorAtual']
              assert api(4000,'/contas/0/depositar',{'valor':25},token)[0]==200
              op={'tipo':'DEPOSITO','valor':10,'vetorConhecido':vetor}
              code,body=api(4000,'/contas/0/sincronizar',op,token); assert code==409
              capture('conflito-sincronizacao','Sincronização com vetor anterior recusada',['$ POST :4000/contas/0/sincronizar',json.dumps(op),'HTTP '+str(code)]+json.dumps(body,indent=2,ensure_ascii=False).splitlines())
              op['vetorConhecido']=body['vetorAtual']
              assert api(4000,'/contas/0/sincronizar',op,token)[0]==200
              print('Transferência local e transferência remota via RabbitMQ confirmadas.')
              sh('bash','/tmp/start-iceibank','2')
              wait(lambda:leaders([0,1,2],2))
          PY
          python3 /tmp/icei_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint3-backend
          path: evidencias/sprint3/*.png
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Prepare native Flutter integration test
        run: |
          mkdir -p app_mobile/integration_test
          sed -i '/^dev_dependencies:/a\  integration_test:\n    sdk: flutter' app_mobile/pubspec.yaml
          cat > app_mobile/integration_test/sprint3_e2e_test.dart <<'DART'
          import 'dart:io';
          
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:iceibank_mobile/main.dart' as app;
          import 'package:integration_test/integration_test.dart';
          import 'package:path_provider/path_provider.dart';
          
          void main() {
            IntegrationTestWidgetsFlutterBinding.ensureInitialized();
            testWidgets('Sprint 3 com agências reais e rede do Android', (tester) async {
              final dir = (await tester.runAsync(getApplicationSupportDirectory))!;
              final stage = File('${dir.path}/icei-stage');
              final ack = File('${dir.path}/icei-ack');
          
              Future<void> waitFor(Finder wanted) async {
                for (var tries = 0; tries < 190; tries++) {
                  await tester.pump(const Duration(milliseconds: 200));
                  if (wanted.evaluate().isNotEmpty) return;
                  await tester.runAsync(() => Future<void>.delayed(const Duration(milliseconds: 200)));
                }
                fail('Estado aguardado: $wanted. Textos atuais: '
                    '${tester.widgetList<Text>(find.byType(Text)).map((t) => t.data).toList()}');
              }
          
              // A captura e os controles de rede são feitos no host via ADB.
              Future<void> checkpoint(String event) async {
                await tester.pump(const Duration(milliseconds: 750));
                await tester.runAsync(() => stage.writeAsString(event, flush: true));
                for (var tries = 0; tries < 400; tries++) {
                  final accepted = await tester.runAsync(() async =>
                      await ack.exists() && (await ack.readAsString()).trim() == event);
                  if (accepted == true) return;
                  await tester.pump(const Duration(milliseconds: 200));
                  await tester.runAsync(() => Future<void>.delayed(const Duration(milliseconds: 150)));
                }
                fail('O host não confirmou a etapa $event.');
              }
          
              Future<void> deposit(String value) async {
                final button = find.text('Depositar');
                await waitFor(button);
                await tester.ensureVisible(button);
                await tester.tap(button);
                await tester.pumpAndSettle();
                await tester.enterText(find.byType(TextField).first, value);
                final confirm = find.text('Confirmar');
                await tester.ensureVisible(confirm);
                await tester.tap(confirm);
                await tester.pumpAndSettle();
              }
          
              app.main();
              await waitFor(find.text('Entrar'));
              await tester.enterText(find.byType(TextField).at(0), 'ana');
              await tester.enterText(find.byType(TextField).at(1), 'senha123');
              await tester.tap(find.text('Entrar'));
              await waitFor(find.text('Agência 2'));
              await checkpoint('lider-inicial');
          
              await waitFor(find.text('0 · Sem resposta'));
              expect(find.text('Agência 2'), findsOneWidget);
              await checkpoint('agencias');
          
              await waitFor(find.text('Agência 1'));
              await checkpoint('failover');
          
              final refresh = find.byTooltip('Atualizar saldo');
              await tester.tap(refresh);
              await waitFor(find.text('Saldo confirmado'));
              await waitFor(find.text(r'R$ 100,00'));
              await checkpoint('desligar-rede');
              await waitFor(find.text('Agências inacessíveis'));
              await deposit('25');
              await waitFor(find.text('Saldo provisório'));
              await checkpoint('offline');
              await waitFor(find.text('Operação sincronizada.'));
              await waitFor(find.text(r'R$ 125,00'));
              await checkpoint('sincronizacao');
          
              await checkpoint('desligar-para-conflito');
              await waitFor(find.text('Agências inacessíveis'));
              await deposit('10');
              await waitFor(find.text('Saldo provisório'));
              await checkpoint('provocar-conflito');
              await waitFor(find.text('Sincronização bloqueada'));
              await waitFor(find.text(r'R$ 140,00'));
              await checkpoint('conflito');
            }, timeout: const Timeout(Duration(minutes: 9)));
          }
          DART
          cat > /tmp/icei_android_v2.py <<'PY'
          from icei_evidence import *
          import sys
          
          pkg='com.example.iceibank_mobile'
          def adb(*args): return sh('adb',*args)
          def airplane(enabled):
              adb('shell','cmd','connectivity','airplane-mode','enable' if enabled else 'disable')
              adb('shell','svc','wifi','disable' if enabled else 'enable')
              adb('shell','svc','data','disable' if enabled else 'enable')
          def screenshot(name,title,detail):
              capture(name,title,[detail],subprocess.check_output(['adb','exec-out','screencap','-p']))
          def stage_is(target):
              actual=subprocess.run(['adb','shell','run-as',pkg,'cat','files/icei-stage'],capture_output=True,text=True)
              return actual.returncode==0 and actual.stdout.strip()==target
          def ack(stage): adb('shell',f'run-as {pkg} sh -c "echo {stage} > files/icei-ack"')
          def step(stage,act,duration=95):
              wait(lambda:stage_is(stage),duration)
              act()
              ack(stage)
              print('Android:',stage,flush=True)
          
          def initial():
              screenshot('app-lider-atual','Flutter em Android com três agências reais','Líder inicial: agência 2.')
              stop(0)
          
          def restore():
              screenshot('funcionalidade-adicional','Indicador de agências no Android','Agência 0 encerrada e agência 2 ainda líder.')
              sh('bash','/tmp/start-iceibank','0')
              wait(lambda:leaders([0,1,2],2))
              tok=api(4000,'/auth/login',{'login':'ana','senha':'senha123'})[1]['token']
              # A conta estava na sessão do app antes da queda da agência 0.
              code=api(4000,'/contas',{'id':0,'nomeAluno':'Ana','saldoInicial':100},tok)[0]
              assert code==201,code
              stop(2)
              wait(lambda:leaders([0,1],1))
          
          def offline():
              screenshot('app-offline','Android em modo avião','Depósito de R$ 25 pendente e saldo provisório.')
              airplane(False)
          
          def synced():
              tok=api(4000,'/auth/login',{'login':'ana','senha':'senha123'})[1]['token']
              assert api(4000,'/contas/0',token=tok)[1]['saldo']==125
              screenshot('app-sincronizacao','Reconexão automática no Android','A API confirmou saldo 125 depois da fila offline.')
          
          def external_change():
              tok=api(4000,'/auth/login',{'login':'ana','senha':'senha123'})[1]['token']
              assert api(4000,'/contas/0/depositar',{'valor':15},tok)[0]==200
              airplane(False)
          
          step('lider-inicial',initial,360)
          step('agencias',restore)
          step('failover',lambda:screenshot('app-failover','Flutter acompanhou a reeleição automática','A agência 2 foi encerrada. A agência 1 virou líder.'))
          step('desligar-rede',lambda:airplane(True))
          step('offline',offline)
          step('sincronizacao',synced)
          step('desligar-para-conflito',lambda:airplane(True))
          step('provocar-conflito',external_change)
          step('conflito',lambda:screenshot('app-conflito-409','Bloqueio HTTP 409 no Android','Mudança externa; o app exibe o saldo confirmado de R$ 140.'))
          PY
          cat > /tmp/icei-android.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          adb shell wm size 520x1000
          adb shell wm density 160
          (
            cd app_mobile
            flutter test -r expanded integration_test/sprint3_e2e_test.dart -d emulator-5554
          ) > /tmp/iceibank-android.log 2>&1 &
          test_pid=$!
          if ! python3 /tmp/icei_android_v2.py; then
            tail -100 /tmp/iceibank-android.log
            adb logcat -d -t 200 > /tmp/iceibank-android-logcat.log || true
            kill "$test_pid" 2>/dev/null || true
            exit 1
          fi
          wait "$test_pid" || { tail -100 /tmp/iceibank-android.log; exit 1; }
          tail -60 /tmp/iceibank-android.log
          SH
      - name: Enable local emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: bash /tmp/icei-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint3-e2e
          path: |
            evidencias/sprint3/*.png
            /tmp/iceibank-*.log
