spring.application.name=agencia

# Sobrescrito em tempo de execucao por AgenciaApplication, a partir de AGENCIA_ID.
agencia.id=0
server.port=4000

# --- Autenticacao JWT (Parte F) ---
# O segredo e o mesmo nas 3 agencias: e o que permite uma agencia validar o token de
# servico emitido por outra. Em producao viria de variavel de ambiente, nunca do arquivo.
iceibank.jwt.segredo=${JWT_SEGREDO:iceibank-sprint1-chave-hmac-sha256-com-tamanho-suficiente-2026}
iceibank.jwt.expiracao-segundos=${JWT_EXPIRACAO:900}
